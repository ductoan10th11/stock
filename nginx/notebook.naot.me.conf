# Jupyter in the stock-notebook container (compose.yaml profile "notebook", 127.0.0.1:8888), behind Cloudflare which terminates TLS.
# Enable with: make nginx-enable-notebook

map $http_upgrade $notebook_connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $notebook_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name notebook.naot.me;

    access_log /var/log/nginx/notebook.naot.me.access.log;
    error_log /var/log/nginx/notebook.naot.me.error.log;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $notebook_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $notebook_connection_upgrade;

        proxy_buffering off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
