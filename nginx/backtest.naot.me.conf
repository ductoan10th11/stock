# Serves the built React app from apps/web/dist and proxies /api to the api container (compose.yaml, 127.0.0.1:8000).
# Build the web first (make build-web), then enable with: make nginx-enable
# `root` is the absolute path of apps/web/dist on this server; nginx needs read access along the whole path.

server {
    listen 80;
    listen [::]:80;
    server_name backtest.naot.me;

    access_log /var/log/nginx/backtest.naot.me.access.log;
    error_log /var/log/nginx/backtest.naot.me.error.log;

    root /home/toan/dev/models/stock/apps/web/dist;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 15s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        text/css
        text/plain
        image/svg+xml;
}
